[project]
name = "qa-playwright-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8",
  "pytest-playwright>=0.7",
  "httpx>=0.28"
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "smoke: critical smoke coverage",
  "regression: regression coverage"
]

