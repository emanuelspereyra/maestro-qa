[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-qa"
version = "0.1.0"
description = "Orquestador multi-agente de testing, expuesto como servidor MCP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_qa"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
