[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-qa"
version = "0.1.0"
description = "Orquestador multi-agente de testing, expuesto como servidor MCP"
requires-python = ">=3.11"
dependencies = ["anthropic", "openai", "pyyaml", "httpx", "mcp"]

[project.scripts]
maestro-qa-mcp = "maestro_qa.mcp_server:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/maestro_qa"]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["vendor"]
